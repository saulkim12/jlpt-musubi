<!-- 기존 서체를 APK 에 포함해 첫 실행부터 인터넷 없이 같은 화면으로 학습한다. -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: 폰 한 손 사용 기준 단일 열(최대 560px). 홈·단어장·시험·표현·통계는 떠 있는 하단 탭, 학습은 전체 화면 카드 한 장.
   디자인 근거(docs/학습설계-근거.md): 배경은 차분한 중립색, 배너의 남색·보라 강조색(--accent)은 학습 대상과 주요 버튼에만(신호 원리),
   카드·문제 화면에는 장식을 두지 않고(일관성 원리) 마스코트는 홈·결과 화면에만 쓴다. */
/* 2.7.0: 번들한 Plex Mono를 공백을 뺀 ASCII·숫자 기호에만 쓰는 별칭(fonts/fonts.css는 원본 그대로 둔다) */
@font-face { font-family: "Musubi Num"; font-style: normal; font-weight: 500; font-display: swap; src: url("fonts/IBMPlexMono-Medium.ttf") format("truetype"); unicode-range: U+0021-007E, U+00D7, U+2013, U+2212; }
:root {
  --paper: #f6f3ee;
  --surface: #ffffff;
  --surface-2: #eeeae3;
  --ink: #1f2330;
  --ink-2: #4d5262;
  --ink-3: #6a6e7c;
  --line: #e2ddd3;
  --ai: #344578;
  --on-ai: #ffffff;
  --ai-soft: #e8e9f2;
  --accent: #5b4892; --accent-2: #6c569d; --on-accent: #ffffff; --accent-soft: #ede8f4; --accent-ink: #564286;
  --hero-a: #24406f; --hero-b: #5b4892; --hero-c: #b9553a;
  --rice: #ffffff; --nori: #2c3a33; --cheek: #f4a3a0; --face: #2a2522; --mascot-line: #3a332e;
  --ja-scale: 1;
  --seq-1: #ddd7eb;
  --seq-2: #b2a5d1;
  --seq-3: #8572b1;
  --seq-4: #574185;
  --again: #564078; --again-soft: #ece5f2;
  --hard: #6d5486; --hard-soft: #f0eaf4;
  --good: #465381; --good-soft: #e7e9f2;
  --easy: #62529a; --easy-soft: #ece9f6;
  --mark: #ded6ee;
  --guide: #aa9ac2;
  --wave-bg: #e9e7f1; --wave-line: #faf9fd;
  --ex-bg: #fbf8f3; --ex-line: #ebe3d5;
  --tile-1a: #344578; --tile-1b: #5b4892; --tile-2a: #594481; --tile-2b: #76609b; --on-tile: #ffffff;
  --shu: #5b4892; --matcha: #485780; --n1: #6a5297; --basic: #525885;
  --scrim: rgb(12 18 30 / 45%);
  --shadow: 0 1px 2px rgb(40 30 20 / 6%), 0 8px 24px rgb(40 30 20 / 7%);
  --shadow-lg: 0 2px 6px rgb(40 30 20 / 8%), 0 14px 36px rgb(40 30 20 / 14%);
  --f-display: "Klee One", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-ja: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
  --f-ko: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  /* 숫자 글꼴(Plex Mono)은 공백을 뺀 영문·숫자·기호에만 쓴다. 한글·일본어와 띄어쓰기는 본문 글꼴로(고정폭 공백으로 벌어지지 않게) */
  --f-num: "Musubi Num", "IBM Plex Sans KR", "IBM Plex Sans JP", "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 18px;
  --seg-on: #ffffff; --seg-ring: transparent; --switch-line: var(--line);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121318; --surface: #1b1d24; --surface-2: #252832; --ink: #ecebe7; --ink-2: #b3b4b9; --ink-3: #8b8d96; --line: #2f323c;
    --ai: #b6b8df; --on-ai: #19182c; --ai-soft: #292b43;
    --accent: #b4a5df; --accent-2: #cabce9; --on-accent: #20172f; --accent-soft: #2f263f; --accent-ink: #d0bfee;
    --hero-a: #1e3560; --hero-b: #4b3c7d; --hero-c: #9c4630;
    --rice: #f6f1e7; --nori: #1d2621; --cheek: #e98f8c;
    --seq-1: #353047; --seq-2: #5b4e78; --seq-3: #8a78ae; --seq-4: #c9b9e5;
    --again: #c4addf; --again-soft: #33273f; --hard: #c5b4d8; --hard-soft: #30283a; --good: #b0b9dc; --good-soft: #272c40; --easy: #bfb0e6; --easy-soft: #2c2742;
    --mark: #4a3a61; --guide: #71618d; --scrim: rgb(0 0 0 / 60%); --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 8px 24px rgb(0 0 0 / 28%); --shadow-lg: 0 2px 6px rgb(0 0 0 / 35%), 0 14px 36px rgb(0 0 0 / 40%);
    --wave-bg: #242237; --wave-line: #2d2940; --ex-bg: #1f2129; --ex-line: #343745;
    --tile-1a: #344578; --tile-1b: #574581; --tile-2a: #5b4880; --tile-2b: #76609b; --on-tile: #ffffff; --shu: #c4b1e3; --matcha: #b0b9dc; --n1: #c5b1e7; --basic: #b6b6de;
    /* 2.7.0: 채운 버튼은 한 단계 깊은 보라에 흰 글자(밝은 버튼이 여럿일 때 눈부심), 고른 칸·꺼진 스위치가 보이게 */
    --accent: #7563b3; --accent-2: #7966b8; --on-accent: #ffffff;
    --seg-on: #3a3e5a; --seg-ring: rgb(182 184 223 / 45%); --switch-line: #4a4e5c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121318; --surface: #1b1d24; --surface-2: #252832; --ink: #ecebe7; --ink-2: #b3b4b9; --ink-3: #8b8d96; --line: #2f323c;
  --ai: #b6b8df; --on-ai: #19182c; --ai-soft: #292b43;
  --accent: #b4a5df; --accent-2: #cabce9; --on-accent: #20172f; --accent-soft: #2f263f; --accent-ink: #d0bfee;
  --hero-a: #1e3560; --hero-b: #4b3c7d; --hero-c: #9c4630;

  --seq-1: #353047; --seq-2: #5b4e78; --seq-3: #8a78ae; --seq-4: #c9b9e5;
  --again: #c4addf; --again-soft: #33273f; --hard: #c5b4d8; --hard-soft: #30283a; --good: #b0b9dc; --good-soft: #272c40; --easy: #bfb0e6; --easy-soft: #2c2742;
  --mark: #4a3a61; --guide: #71618d; --scrim: rgb(0 0 0 / 60%); --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 8px 24px rgb(0 0 0 / 28%); --shadow-lg: 0 2px 6px rgb(0 0 0 / 35%), 0 14px 36px rgb(0 0 0 / 40%);
  --wave-bg: #242237; --wave-line: #2d2940; --ex-bg: #1f2129; --ex-line: #343745;
  --tile-1a: #344578; --tile-1b: #574581; --tile-2a: #5b4880; --tile-2b: #76609b; --on-tile: #ffffff; --shu: #c4b1e3; --matcha: #b0b9dc; --n1: #c5b1e7; --basic: #b6b6de;
  --accent: #7563b3; --accent-2: #7966b8; --on-accent: #ffffff;
  --seg-on: #3a3e5a; --seg-ring: rgb(182 184 223 / 45%); --switch-line: #4a4e5c;
  color-scheme: dark;

* { box-sizing: border-box; }
html, body { background: var(--paper); }
body { color: var(--ink); font-family: var(--f-ko); font-size: 15px; line-height: 1.55; word-break: keep-all; overflow-wrap: anywhere; -webkit-tap-highlight-color: transparent; }
body.studying, body.sheet-open { overflow: hidden; }
[lang="ja"] { font-family: var(--f-ja); word-break: normal; line-break: strict; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }

.shell { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px calc(92px + env(safe-area-inset-bottom, 0px)); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; }
.brand-sub { display: block; font-size: 10px; font-weight: 500; color: var(--ink-2); letter-spacing: 0.04em; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--ai); color: var(--on-ai); display: grid; place-items: center; font-family: var(--f-num); font-size: 13px; }
.sync { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px 4px 9px; font-size: 12px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.sync[data-state="cloud"] i, .sync[data-state="app"] i { background: var(--good); }
.sync[data-state="saving"] i { background: var(--hard); }
.sync[data-state="error"] i { background: var(--again); }

#view { display: flex; flex-direction: column; gap: 14px; }
.home-tabs { position: sticky; top: 0; z-index: 2; }
.home-pages { min-width: 0; touch-action: pan-y pinch-zoom; }
.home-page { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.home-page[hidden] { display: none; }
.panel { background: var(--surface); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.panel h2 { margin: 0; font-size: 14px; font-weight: 600; color: var(--ink-2); letter-spacing: 0.02em; }
.panel p { margin: 0; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 16px; font-weight: 500; text-align: center; }
.btn.primary { background: var(--ai); border-color: var(--ai); color: var(--on-ai); }
.btn.big { padding: 15px 16px; font-size: 16px; font-weight: 600; }
.btn.danger { color: var(--again); }
.btn.danger.armed { background: var(--again); border-color: var(--again); color: var(--surface); }
.btn:disabled { opacity: 0.5; cursor: default; }
.icon-btn { width: 40px; height: 40px; border: 0; background: none; border-radius: 10px; display: grid; place-items: center; color: var(--ink-2); }
.icon-btn:disabled { opacity: 0.3; }
.icon-btn svg, .speak svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* 홈: 수험표 */
.ticket { display: grid; grid-template-columns: 1fr auto; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.ticket-main { padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ticket-label { font-size: 11px; letter-spacing: 0.12em; color: var(--ink-3); font-family: var(--f-num); }
.ticket-title { font-weight: 600; }
.ticket-sub { font-size: 12px; color: var(--ink-2); }
.ticket-dday { padding: 14px 18px; border-left: 2px dashed var(--line); display: grid; place-items: center; font-family: var(--f-num); font-size: 26px; color: var(--ai); background: var(--ai-soft); }

.counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.count { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; border-radius: 12px; background: var(--surface-2); }
.count b { font-size: 28px; font-weight: 500; line-height: 1.1; }
.count span { font-size: 12px; color: var(--ink-2); }
.c-new { color: var(--easy); }
.c-learn { color: var(--again); }
.c-rev { color: var(--good); }
.done-msg { display: flex; flex-direction: column; gap: 4px; padding: 6px 0; }
.done-msg b { font-size: 18px; }

.figures { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.figure { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.figure b { font-size: 22px; font-weight: 500; }
.figure span { font-size: 12px; color: var(--ink-2); }

.prog { display: flex; flex-direction: column; gap: 6px; }
.prog-head { display: flex; justify-content: space-between; font-size: 14px; }
.stack { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
.stack i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.s-learn { background: var(--seq-1); }
.s-young { background: var(--seq-2); }
.s-mature { background: var(--seq-4); }
.s-none { background: var(--surface-2); border: 1px solid var(--line); }

/* 차트 */
.chart { display: flex; flex-direction: column; gap: 6px; }
.readout { font-size: 13px; color: var(--ink-2); min-height: 20px; }
.readout b { color: var(--ink); font-weight: 500; }
.chart svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
.ch-grid { stroke: var(--line); stroke-width: 1; }
.ch-base { stroke: var(--ink-3); stroke-width: 1; }
.ch-label { fill: var(--ink-3); font-family: var(--f-num); font-size: 10px; }
.ch-bar { fill: var(--seq-3); }
.ch-bar.on { fill: var(--ai); }
.ch-hit { fill: transparent; }

/* 단어장 */
.search { display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 14px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 8px; color: var(--ink-2); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip-btn { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--ink-2); }
.chip-btn[aria-pressed="true"] { background: var(--ai); border-color: var(--ai); color: var(--on-ai); }
.list { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(84px, 38%) 1fr 10px; gap: 12px; align-items: center; padding: 11px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.row:last-child { border-bottom: 0; }
.row-jp { display: flex; flex-direction: column; min-width: 0; }
.row-word { font-size: 17px; font-weight: 500; }
.row-read { font-size: 12px; color: var(--ink-2); }
.row-mean { font-size: 14px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-width: 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); }
.dot[data-s="learn"] { background: var(--seq-1); border-color: var(--seq-1); }
.dot[data-s="young"] { background: var(--seq-2); border-color: var(--seq-2); }
.dot[data-s="mature"] { background: var(--seq-4); border-color: var(--seq-4); }
.dot[data-s="sus"] { background: none; border: 2px solid var(--hard); }
.list-foot { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--ink-2); }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); }

/* 카드 내용(학습·상세 공용) */
.kind { font-size: 12px; color: var(--ink-3); letter-spacing: 0.04em; display: flex; gap: 8px; align-items: center; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--easy-soft); color: var(--easy); }
.fw { font-family: var(--f-display); font-weight: 600; line-height: 1.2; text-align: center; }
.fw.xl { font-size: 64px; } .fw.l { font-size: 52px; } .fw.m { font-size: 40px; } .fw.s { font-size: 30px; }
.masu { width: min(52vw, 210px); aspect-ratio: 1; max-width: 100%; border: 2px solid var(--ink-2); position: relative; display: grid; place-items: center; background: var(--surface); }
.masu::before, .masu::after { content: ""; position: absolute; border: 0 dashed var(--guide); }
.masu::before { left: 50%; top: 0; bottom: 0; border-left-width: 1px; }
.masu::after { top: 50%; left: 0; right: 0; border-top-width: 1px; }
.masu span { position: relative; z-index: 1; font-family: var(--f-display); font-weight: 600; font-size: min(36vw, 150px); line-height: 1; }
.back { display: flex; flex-direction: column; gap: 14px; }
.reading { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 22px; }
.meaning { font-size: 19px; font-weight: 600; text-align: center; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.chip.warn { background: var(--again-soft); color: var(--again); }
.note { font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); color: var(--ink-2); }
.note b { color: var(--ink); font-weight: 600; }
.note.warn { background: var(--again-soft); color: var(--again); }
.note.warn b { color: var(--again); }
.ex { display: flex; flex-direction: column; gap: 4px; padding-left: 12px; border-left: 3px solid var(--line); }
.ex-ja { margin: 0; font-size: 16px; line-height: 1.7; display: flex; gap: 4px; align-items: flex-start; }
.ex-ja > span { flex: 1; }
.ex-ja mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
.ex-ko { margin: 0; font-size: 14px; color: var(--ink-2); }
.speak { flex: none; width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--ink-3); display: inline-grid; place-items: center; }
.speak svg { width: 18px; height: 18px; }
.sub-title { font-size: 12px; color: var(--ink-3); letter-spacing: 0.04em; margin-bottom: -6px; }
.kj-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.kj-row { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.kj-row:last-child { border-bottom: 0; }
.kj-ch { font-family: var(--f-display); font-size: 26px; font-weight: 600; text-align: center; }
.kj-ko { font-size: 15px; }
.kj-ko small { color: var(--ink-3); margin-left: 4px; }
.kj-on { font-size: 13px; color: var(--ink-2); }
.hun { font-size: 24px; text-align: center; }
.hun b { font-weight: 600; }
.trad { font-size: 14px; color: var(--ink-2); margin-left: 6px; }
.readings { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; align-items: baseline; }
.readings dt { font-size: 12px; color: var(--ink-3); }
.readings dd { margin: 0; font-size: 17px; }
.status-line { font-size: 13px; color: var(--ink-2); text-align: center; }

/* 학습 화면 */
.study { position: fixed; inset: 0; z-index: 20; background: var(--paper); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.study-in { width: 100%; max-width: 560px; margin: 0 auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding-block: 8px 12px; }

/* 시트·토스트 */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }

.sheet { position: relative; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: var(--surface); border-radius: 18px 18px 0 0; padding: 8px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }

/* 접수·할인 정보 */

/* 시험 탭·모의고사 */

.test-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.part-list { width: 100%; display: flex; flex-direction: column; gap: 8px; }

.passage { padding: 14px 16px; border-radius: 12px; background: var(--ex-bg); border: 1px solid var(--ex-line); font-size: 15px; line-height: 1.9; max-height: 45vh; overflow-y: auto; }

/* 문제 카드가 화면보다 길면 지문이 한 줄로 눌리지 않고 카드 전체가 스크롤되게 한다. */

/* 2.3.0 文章の文法 빈칸: 지금 문항의 칸만 강조한다 */

/* 청해 메모장 */

.scene-art .tape { stroke: var(--sc-p3); stroke-width: 4; } .scene-art .tie { stroke: var(--sc-ln); stroke-width: 2; } .scene-art .steth { stroke: var(--sc-dk); stroke-width: 1.8; }
.scene-art .glass { stroke: var(--sc-dk); stroke-width: 1.5; } .scene-art .cane { stroke: var(--sc-wd); stroke-width: 3; } .scene-art .mouth { stroke: var(--sc-hr); stroke-width: 1.5; }
.scene-art .eye { fill: var(--sc-hr); } .scene-art .ch { fill: var(--sc-cheek); opacity: .75; } .scene-art .flame { fill: var(--sc-p3); }
.scene-art .arm { fill: none !important; stroke-width: 7; stroke-linecap: round; }
.scene-art .arrow { fill: var(--sc-arrow); stroke: var(--sc-w); stroke-width: 2; stroke-linejoin: round; }
/* 유형 골라 풀기 */
.drill-group { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.drill-group .chip-btn { display: inline-flex; align-items: center; gap: 6px; }
.new-dot { font-size: 10px; font-weight: 700; letter-spacing: .04em; color: var(--accent-ink); background: var(--accent-soft); border-radius: 999px; padding: 1px 6px; }
.chip-btn[aria-pressed="true"] .new-dot { color: var(--on-ai); background: transparent; }
.mx-timer { font-size: 15px; color: var(--ink-2); min-width: 48px; text-align: right; }
.mx-timer.urgent { color: var(--again); font-weight: 700; }
.opt.picked { border-color: var(--ai); background: var(--ai-soft); font-weight: 600; }
.score-ring { --p: 0; width: 132px; height: 132px; border-radius: 50%; background: conic-gradient(var(--ai) calc(var(--p) * 1%), var(--surface-2) 0); display: grid; place-content: center; text-align: center; position: relative; }
.score-ring::before { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: var(--paper); }
.score-ring b, .score-ring span { position: relative; }
.score-ring b { font-size: 34px; line-height: 1; }
.score-ring span { font-size: 13px; color: var(--ink-2); }
.chip.good-chip { background: var(--good-soft); color: var(--good); }
.stack.min-line { position: relative; }
.stack.min-line::after { content: ""; position: absolute; left: 31.6%; top: 0; bottom: 0; width: 2px; background: var(--ink-2); }
.wrong-list { width: 100%; text-align: left; }
.wrong-list summary { cursor: pointer; font-weight: 600; padding: 8px 0; }
.deck-row { display: flex; flex-direction: column; gap: 2px; padding-top: 8px; border-top: 1px solid var(--line); }
.deck-row:first-of-type { border-top: 0; padding-top: 0; }
.fc-more summary, .more-fold summary { cursor: pointer; font-size: 13px; color: var(--ink-2); padding: 6px 0; }
.fc-more[open] > summary, .more-fold[open] > summary { margin-bottom: 6px; }
.wrong-list .info-card { margin-top: 8px; }
.ch-pass { stroke: var(--again); stroke-dasharray: 4 4; stroke-width: 1; }
.credits { display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: var(--ink-2); }
.credits dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; }
.credits dt { color: var(--ink-3); white-space: nowrap; }
.credits dd { margin: 0; }

/* 테스트 화면 */
.s-card.quiz { gap: 14px; }
.q-guide { margin: 0; font-size: 14px; color: var(--ink-2); }
.q-stem { margin: 0; font-size: 20px; line-height: 1.9; font-weight: 500; padding: 14px 16px; border-radius: 14px; background: var(--ex-bg); border: 1px solid var(--ex-line); }
.q-under { text-decoration: underline 2px var(--ai); text-underline-offset: 5px; font-weight: 700; }
.q-blank { display: inline-block; min-width: 3.5em; border-bottom: 2px solid var(--ai); margin: 0 4px; }
.q-cloze { width: 100%; display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; align-items: center; gap: 10px; }
.opt-no { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--surface-2); color: var(--ink-2); }
.opt.idk { justify-content: center; }
.finish.result { justify-content: flex-start; overflow-y: auto; padding-bottom: 8px; }
.cell-dots { display: inline-flex; gap: 4px; }
.cell-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); }
.cell-dots i.on { background: var(--good); border-color: var(--good); }
tr.weak td { background: var(--again-soft); }
.tier.wide { grid-template-columns: 80px 1fr 44px; }
.seg { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 1fr; }

/* ── 가시성 개편: 핵심 정보 강조(신호 원리), 青海波 무늬 포인트 ── */
.seigaiha {
  background-color: var(--wave-bg);
  background-image:
    radial-gradient(circle at 100% 150%, var(--wave-bg) 24%, var(--wave-line) 24% 28%, var(--wave-bg) 28% 36%, var(--wave-line) 36% 40%, transparent 40%),
    radial-gradient(circle at 0 150%, var(--wave-bg) 24%, var(--wave-line) 24% 28%, var(--wave-bg) 28% 36%, var(--wave-line) 36% 40%, transparent 40%),
    radial-gradient(circle at 50% 100%, var(--wave-line) 10%, var(--wave-bg) 10% 23%, var(--wave-line) 23% 30%, var(--wave-bg) 30% 43%, var(--wave-line) 43% 50%, var(--wave-bg) 50% 63%, var(--wave-line) 63% 71%, transparent 71%),
    radial-gradient(circle at 100% 50%, var(--wave-line) 5%, var(--wave-bg) 5% 15%, var(--wave-line) 15% 20%, var(--wave-bg) 20% 29%, var(--wave-line) 29% 34%, var(--wave-bg) 34% 44%, var(--wave-line) 44% 49%, transparent 49%),
    radial-gradient(circle at 0 50%, var(--wave-line) 5%, var(--wave-bg) 5% 15%, var(--wave-line) 15% 20%, var(--wave-bg) 20% 29%, var(--wave-line) 29% 34%, var(--wave-bg) 34% 44%, var(--wave-line) 44% 49%, transparent 49%);
  background-size: 48px 24px;
}
.s-card { padding-top: 0; }
.s-card > .band { flex: none; height: 14px; margin: 0 -18px; border-radius: var(--radius) var(--radius) 0 0; }
.ticket-dday.seigaiha { color: var(--ai); text-shadow: 0 0 8px var(--wave-bg); }
.kind { font-weight: 500; }
.kind .type { padding: 3px 10px; border-radius: 999px; color: var(--on-tile); background: var(--ai); font-size: 11px; letter-spacing: 0.06em; }
.kind .type.k { background: var(--shu); }
.kind .type.p { background: var(--matcha); }
.reading { gap: 4px; }
.reading > span:first-child { padding: 2px 14px; border-radius: 999px; background: var(--ai-soft); color: var(--ai); font-weight: 500; }
.meaning { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
.sec-label { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: 0.08em; margin-bottom: -4px; }
.sec-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.ex { position: relative; padding: 14px 16px 12px; border: 1px solid var(--ex-line); border-left: 4px solid var(--ai); background: var(--ex-bg); border-radius: 14px; gap: 8px; }
.ex-ja { font-size: 18px; line-height: 1.85; font-weight: 500; color: var(--ink); }
.ex-ja.has-ruby { line-height: 2.35; }
.ex-ja mark { background: linear-gradient(transparent 52%, var(--mark) 52%); color: var(--ink); font-weight: 700; padding: 0 2px; border-radius: 0; }
.ex-ja ruby rt { color: var(--ai); opacity: 0.85; font-weight: 500; }
.ex-ko { font-size: 14.5px; color: var(--ink-2); padding-top: 8px; border-top: 1px dashed var(--ex-line); }
.rate { border-bottom: 3px solid currentColor; }
.btn.primary.big { background: linear-gradient(135deg, var(--ai), var(--tile-1b)); border: 0; box-shadow: 0 6px 16px rgb(43 74 128 / 25%); }
.media { display: grid; gap: 10px; }
.media-tile { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; text-decoration: none; color: var(--on-tile); background: linear-gradient(135deg, var(--tile-1a), var(--tile-1b)); box-shadow: var(--shadow); min-width: 0; }
.media-tile.yt { background: linear-gradient(135deg, var(--tile-2a), var(--tile-2b)); }
.media-tile svg { width: 40px; height: 40px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.media-tile b { display: block; font-size: 16px; font-weight: 700; }
.media-tile small { display: block; font-size: 12px; opacity: 0.85; }
.media-tile .go { font-size: 18px; opacity: 0.9; }
.media-note { font-size: 12px; color: var(--ink-3); margin: 0; }

/* ── 디자인 개편 v3: 근거 기반 토큰·레이아웃(docs/학습설계-근거.md 「디자인·레이아웃」) ── */
.shell { padding-bottom: calc(118px + env(safe-area-inset-bottom, 0px)); }
.brand-mark { border-radius: 10px; background: linear-gradient(140deg, var(--hero-a), var(--hero-b)); color: #fff; }
.panel { border-radius: var(--radius); padding: 18px; }
.panel h2 { font-size: 15px; font-weight: 700; color: var(--ink); letter-spacing: 0; }
.btn { border-radius: 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.big { min-height: 56px; }
.btn.primary.big, .mock-btn.main { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: 0; color: var(--on-accent); box-shadow: 0 6px 18px rgb(91 72 146 / 26%); }
.mock-btn.main span { color: var(--on-accent); }
.chip-btn[aria-pressed="true"] { background: var(--ai); border-color: var(--ai); color: var(--on-ai); }
.rec-chip { font-size: 11px; font-weight: 700; color: var(--accent-ink); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; }

/* 서체: 카드·문제의 일본어는 고딕(가독성), 손글씨풍 Klee One 은 한자 칸·로고에만 */
.fw, .g-pattern, .ja-head, .discover-main b { font-family: var(--f-ja); font-weight: 600; }
.fw { letter-spacing: 0.01em; }
.g-pattern { color: var(--accent-ink); }
.ex-ja { font-size: calc(18px * var(--ja-scale)); line-height: 1.8; }
.ex-ja.has-ruby { line-height: 2.3; }
.ex-ja mark { color: var(--accent-ink); background: linear-gradient(transparent 56%, var(--mark) 56%); }
.passage { font-size: calc(15.5px * var(--ja-scale)); line-height: 1.8; }
.q-stem { font-size: calc(19px * var(--ja-scale)); }
.transcript { font-size: calc(14px * var(--ja-scale)); }
.opt { font-size: calc(15px * var(--ja-scale)); min-height: 52px; }
.connect .c-base { color: var(--ai); font-weight: 600; }
.connect .c-pat { color: var(--accent-ink); font-weight: 700; }
.step-btn { align-self: flex-start; }
.s-card[data-t="g"].revealed .front > .g-pattern, .s-card[data-t="g"].revealed .front > .g-pattern + p { display: none; }
.kind .type { color: var(--on-ai); }
.toast { width: max-content; }
.finish { min-height: 0; overflow-y: auto; }
.finish:not(.result)::before, .finish:not(.result)::after { content: ""; flex: 1 1 0; }
.finish:not(.result) { justify-content: flex-start; }
.choice.rec b { padding-right: 44px; }
/* With a mouse (PC web), sideways-scrolling chip rows wrap to the next line so they never need keyboard or sideways scrolling.
   On touch screens, keep the swipeable single-line chips */
@media (hover: hover) and (pointer: fine) {
  .chips { flex-wrap: wrap; overflow: visible; }
}

/* 정오 표시는 색 + 기호(색약 대비) */
.opt.right::after, .opt.wrong::after { margin-left: auto; font-weight: 700; }
.opt.right::after { content: "✓"; }
.opt.wrong::after { content: "✕"; }

/* 홈 히어로: 마스코트 + 구체적 성장 한마디 + D-day + 오늘 진척 링 */
.hero { position: relative; overflow: hidden; border-radius: var(--radius); padding: 18px; color: #fff; background: linear-gradient(135deg, var(--hero-a), var(--hero-b) 62%, var(--hero-c)); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: 16px; }
.hero .waves { position: absolute; left: 0; right: 0; bottom: 0; height: 62%; --wave-bg: var(--hero-b); --wave-line: rgb(255 255 255 / 10%); opacity: 0.9; -webkit-mask-image: linear-gradient(to top, #000, transparent); mask-image: linear-gradient(to top, #000, transparent); pointer-events: none; }
.hero > :not(.waves) { position: relative; }
.hero-top { display: flex; align-items: center; gap: 12px; }
.bubble { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-radius: 16px 16px 16px 4px; background: rgb(255 255 255 / 14%); border: 1px solid rgb(255 255 255 / 18%); }
.bubble b { font-size: 15px; }
.bubble span { font-size: 13.5px; opacity: 0.92; }
.hero-row { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
.hero-dday { border: 0; background: none; color: inherit; text-align: left; padding: 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; font: inherit; }
.hero-dday .lbl { font-size: 12px; opacity: 0.85; letter-spacing: 0.04em; }
.hero-dday b { font-family: var(--f-num); font-size: 40px; font-weight: 500; line-height: 1.05; letter-spacing: -0.02em; }
.hero-dday .lnk { font-size: 12px; font-weight: 600; opacity: 0.9; }
.ring { --p: 0; width: 92px; height: 92px; border-radius: 50%; display: grid; place-content: center; text-align: center; position: relative; }
.ring::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(#ded6ee calc(var(--p) * 1%), rgb(255 255 255 / 20%) 0); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px)); mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px)); }
.ring b { font-family: var(--f-num); font-size: 22px; font-weight: 500; line-height: 1; }
.ring span { font-size: 11px; opacity: 0.85; margin-top: 2px; }
.hero-today { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; padding-top: 12px; border-top: 1px solid rgb(255 255 255 / 18%); }
.hero-today b { font-family: var(--f-num); font-weight: 500; }

/* 오늘 할 일: 사용자가 고르고, 추천은 하나만 */
.counts .count { background: var(--surface-2); }
.count:nth-child(1) { background: var(--easy-soft); }
.count:nth-child(2) { background: var(--again-soft); }
.count:nth-child(3) { background: var(--good-soft); }
.choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; padding: 13px 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); min-height: 80px; color: var(--ink); }
.choice b { font-size: 14.5px; }
.choice span { font-size: 12px; color: var(--ink-2); }
.choice:disabled { opacity: 0.45; }
.choice.rec { border: 2px solid var(--accent); padding: 12px 13px; }
.choice .rec-chip { position: absolute; top: 9px; right: 9px; }
.start-main { position: relative; }
.start-main .rec-chip { position: absolute; top: -9px; right: 12px; box-shadow: var(--shadow); }
.return-panel { border: 2px solid var(--accent-soft); }
.return-head { display: flex; gap: 12px; align-items: center; }
.return-head p { margin: 0; }

/* 학습 달력(히트맵): 한 색상 밝기 단계 */
.heat-wrap { display: flex; flex-direction: column; gap: 6px; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, auto); gap: 3px; touch-action: pan-y; }
.heat i { display: block; aspect-ratio: 1.35; border-radius: 3px; background: var(--surface-2); }
.heat i[data-l="1"] { background: var(--seq-1); }
.heat i[data-l="2"] { background: var(--seq-2); }
.heat i[data-l="3"] { background: var(--seq-3); }
.heat i[data-l="4"] { background: var(--seq-4); }
.heat i.today { outline: 1.5px solid var(--ink-2); outline-offset: 1px; }
.heat i.future { background: none; }
.heat i.on { outline: 2px solid var(--accent); outline-offset: 1px; }
.heat-legend { display: flex; align-items: center; gap: 3px; justify-content: flex-end; font-size: 11px; color: var(--ink-3); }
.heat-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.heat-legend span { margin: 0 4px; }
.grow { font-size: 12px; color: var(--good); font-weight: 600; margin-left: 6px; }

/* 떠 있는 하단 탭: 화면 가장자리에서 띄움(한 손 조작) */
.tabs { left: 50%; right: auto; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: min(560px, calc(100% - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px))); padding: 0 6px; border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow-lg); background: var(--surface); }
.tabs-in { max-width: none; }
.tab { padding: 7px 0 8px; gap: 1px; }
.tab svg { width: 50px; height: 30px; padding: 4px 14px; box-sizing: border-box; border-radius: 999px; }
.tab[aria-current="page"] svg { background: var(--ai-soft); }
.toast { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }

/* 학습 화면: 유형 띠는 색 신호(장식 무늬 대신), 묶음 진행, 하단 버튼은 가장자리에서 띄움 */
.study-in { padding-block: 8px 22px; }
.s-card { border-radius: var(--radius); }
.s-card > .band { height: 5px; margin: 0 -18px; background: var(--band, var(--ai)); border-radius: var(--radius) var(--radius) 0 0; }
.s-card[data-t="k"] { --band: var(--shu); }
.s-card[data-t="g"] { --band: var(--hard); }
.s-card[data-t="p"], .s-card[data-t="f"] { --band: var(--matcha); }
.s-card[data-t="n1"] { --band: var(--n1); }
.s-card[data-t="basic"] { --band: var(--basic); }
.s-card[data-t="q"] { --band: var(--accent); }
.kind .type.n1 { background: var(--n1); }
.kind .type.basic { background: var(--basic); }
.s-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); margin-top: -4px; }
.size-btn { width: auto; min-width: 40px; padding: 0 8px; font-weight: 700; font-size: 15px; color: var(--ink-2); }
.top-right { display: flex; align-items: center; gap: 2px; }
.s-actions { gap: 10px; }
.rate { min-height: 64px; }
.chunk-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }

/* 마스코트 '무스비': 2D 정지 표정(홈·결과 화면, 피드백 줄 옆에만) */
.mascot-wrap { display: inline-flex; flex: none; }
.mascot { display: block; flex: none; overflow: visible; }
.mascot .rice { fill: var(--rice); stroke: var(--mascot-line); stroke-width: 3; stroke-linejoin: round; }
.mascot .nori { fill: var(--nori); }
.mascot .face { fill: var(--face); }
.mascot .line { fill: none; stroke: var(--face); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.mascot .cheek { fill: var(--cheek); opacity: 0.75; }
.mascot .spark { fill: #b4a5df; }
.mascot .zz { fill: var(--ink-3); font: 600 14px var(--f-num); }
.mascot.pop { animation: pop 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.3) both; }
@keyframes pop { from { opacity: 0; transform: scale(0.6) translateY(8px); } to { opacity: 1; transform: none; } }
.note.fb { display: flex; gap: 10px; align-items: flex-start; }
.note.fb .mascot { margin-top: -2px; }

/* 결과·완료 화면: 부드러운 보라 배경 톤, 다음 할 일을 가장 크게 */
.finish > * { flex-shrink: 0; }
.finish.warm { background: radial-gradient(130% 55% at 50% 0%, var(--accent-soft), transparent 72%); border-radius: var(--radius); padding: 18px 4px 8px; }
.delta { font-size: 13px; font-weight: 600; color: var(--good); }
.delta.down { color: var(--ink-2); }
.part-break .note { text-align: left; width: 100%; }
.mode-pick { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.mode-pick .btn { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.mode-pick .btn small { font-size: 12px; font-weight: 500; opacity: 0.85; }
.stack i.s-accent { background: var(--accent); }

/* ── 2.2.0 감각 경험: 움직임 토큰·누름 반응·전환·축하(docs/2.2.0-감각경험.md) ──
   카드·문제 내용 위에는 장식을 두지 않고, 경계(묶음·완료·결과)에서만 크게 축하한다.
   앱의 '화면 효과' 끄기(html[data-fx="off"])와 기기의 동작 줄이기에서 모든 움직임이 멈춘다. */
:root { --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1); --ease-soft: cubic-bezier(0.22, 1, 0.36, 1); --ease-spring: cubic-bezier(0.34, 1.45, 0.64, 1); --seal: #b9553a; }
@supports (transition-timing-function: linear(0, 1)) {

// 합성한 소리를 Web Audio 로 재생한다. 소리마다 처음 쓸 때 한 번만 만들고, 테마를 바꾸면 다른 테마 음은 버린다

    'aria-labelledby': `${scope}-tab-${key}`, hidden: key !== ui[state],

document.addEventListener('keydown', e => {

// 설정(2.7.1): 섹션마다 접고, 제목 아래에 지금 값을 한 줄로 보여 준다. 펼친 섹션은 다시 그려도 그대로 둔다.
function foldSettings(sections) {
  const st = S.settings, on = v => (v ? '켬' : '끔'), open = ui.settingsOpen ||= new Set();
  const times = (st.reminderTimes?.length ? st.reminderTimes : [st.reminderTime]).filter(Boolean);
  const decks = [[st.vocabOn, `N2 ${st.newVocab}`], [st.n1On && S.n1.length, `N1 ${st.newN1}`], [st.kanjiOn, `한자 ${st.newKanji}`], [st.grammarOn, `문법 ${st.newGrammar}`],
    [st.n1GrammarOn && S.n1Grammar.length, `N1 문법 ${st.newN1Grammar}`], [st.proverbOn, `속담 ${st.newProverb}`]].filter(([x]) => x).map(([, t]) => t);
  const subs = {
    '나의 목표': `시험 ${String(st.examDate).replaceAll('-', '.')} · 주 ${st.weeklyGoal}일 · 기억률 ${Math.round(st.retention * 100)}%`,
    '공부 알림': st.reminderOn ? (times.join(' · ') || '켬') : '꺼짐',
    '레벨과 시작점': '레벨 테스트 · 단어 보유량 · 아는 카드 걸러내기',
    '기초 과정 (N5~N3)': st.basicOn ? `${st.basicFrom}부터 · 단어 ${st.newBasic} · 문법 ${st.newBasicG}` : '꺼짐',
    '카드 덱 · 하루 새 카드': `${decks.length ? decks.join(' · ') : '켠 덱 없음'} · 복습 최대 ${st.maxReviews}`,
    '화면 · 소리': `일본어 글자 ${['보통', '크게', '아주 크게'][TEXT_SCALES.indexOf(st.textScale || 1)] || '보통'} · 예문 후리가나 ${on(st.exFurigana)}`,
    [fxTitle()]: Haptic.available() ? `효과 ${on(st.effectsOn)} · 진동 ${on(st.hapticsOn)} · 효과음 ${on(st.soundOn)}` : `효과 ${on(st.effectsOn)} · 효과음 ${on(st.soundOn)}`,
    '기록과 백업': '백업 파일 저장·불러오기 · 이동 코드',
    '정보': `단어 ${fmt(S.vocab.length)}개 · 한자 ${fmt(S.kanji.length)}자 · FSRS-5`,
    '크레딧': '만든 사람 · 자료 출처 · 라이선스',
    '초기화': `${native ? '이 폰' : '이 브라우저'}의 학습 기록 지우기`,
  };
  return sections.filter(Boolean).map(sec => {
    // 테스트용 가짜 노드(VM)는 그대로 둔다.
    if (!sec.attributes || typeof sec.querySelector !== 'function') return sec;
    const h = sec.querySelector('h2'), title = h?.textContent || '';
    if (!h) return sec;
    h.remove();
    const fold = el('details', { class: 'set-fold', open: open.has(title) || null },
      el('summary', null, el('h2', { text: title }), subs[title] ? el('small', { class: 'set-sub', text: subs[title] }) : null),
      el('div', { class: 'set-body' }, [...sec.childNodes]));
    fold.addEventListener('toggle', () => { if (fold.open) open.add(title); else open.delete(title); });
    sec.replaceChildren(fold);
    sec.classList.add('set-sec');
    return sec;
  });
}

// ───────── 시작 ─────────
async function start() {
  $('#brand-mascot').replaceChildren(mascot('happy', 28));
  restoreLocal();
  renderSyncChip();
  render();
  try { await loadContent(); }
  catch (e) {
    console.error(e);
    view.replaceChildren(el('section', { class: 'panel' }, el('p', { text: '학습 데이터를 불러오지 못했어요. 앱을 다시 열어 주세요.' })));
    return;
  }
  render();
  try { await Cloud.init(); } catch (e) { Cloud.fail(e); }
  // 앱을 열 때 한 번: 첫 화면의 패널이 차례로 떠오른다
  if (!se) { ui.navFx = 'enter'; render(); }
  if (canRemind()) applyReminder();
  Sound.warm();
  webShell();
}

  if (native) return;
  let leaveAt = 0;
  history.replaceState({ n2: 'base' }, '');
  history.pushState({ n2: 'app' }, '');
  window.addEventListener('popstate', () => {
    if (window.N2Back()) { history.pushState({ n2: 'app' }, ''); return; }
    if (Date.now() - leaveAt < 2000) { history.back(); return; }
    leaveAt = Date.now();
    history.pushState({ n2: 'app' }, '');
    toast('한 번 더 누르면 나가요');
  });
  try { navigator.storage?.persist?.().catch?.(() => {}); } catch (e) { /* 지원 안 함 */ }
}
start();
})();
</script>
